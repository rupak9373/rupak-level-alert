name: Stock Web App Scan

on:
  workflow_dispatch:
  push:
    paths:
      - 'stock-webapp/scan_stocks.py'
      - 'stock-webapp/stock_symbols.txt'
      - 'stock-webapp/scan_options.py'
      - 'stock-webapp/option_symbols.txt'
      - 'stock-webapp/build_extended_data.py'
      - 'stock-webapp/fundamentals.html'
      - '.github/workflows/stock-webapp.yml'
  schedule:
    - cron: '*/5 * * * 1-5'

concurrency:
  group: stock-webapp-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -U jugaad-data pandas requests beautifulsoup4
      - name: Run stock scanner
        run: python stock-webapp/scan_stocks.py
      - name: Run option chain scanner
        run: python stock-webapp/scan_options.py
      - name: Build chart timeframe and fundamentals data
        run: python stock-webapp/build_extended_data.py
      - name: Commit scan data safely
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/stock-webapp-data
          cp stock-webapp/data/results.json /tmp/stock-webapp-data/results.json
          cp stock-webapp/data/option_chain.json /tmp/stock-webapp-data/option_chain.json
          cp stock-webapp/data/extended.json /tmp/stock-webapp-data/extended.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/stock-webapp-data/results.json stock-webapp/data/results.json
          cp /tmp/stock-webapp-data/option_chain.json stock-webapp/data/option_chain.json
          cp /tmp/stock-webapp-data/extended.json stock-webapp/data/extended.json

          git add stock-webapp/data/results.json stock-webapp/data/option_chain.json stock-webapp/data/extended.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stock, option chain and extended data"
            git push origin HEAD:main
          fi
