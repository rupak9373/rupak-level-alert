<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stock Scanner</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#0b1020;color:#eef2ff}header{padding:18px 22px;background:#111827;position:sticky;top:0;z-index:5}.headrow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}h1{margin:0 0 6px}.clock{text-align:right;font-weight:700}.muted{color:#94a3b8}.tabs,.controls{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px}.tabbtn.active{border-color:#60a5fa;background:#172554}.panel{display:none}.panel.active{display:block}input,select,button{padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#111827;color:#fff}button{cursor:pointer}.reset{border-color:#7f1d1d;color:#fecaca}.grid{padding:0 22px 30px;display:grid;gap:12px}.card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:16px;cursor:pointer}.card:hover{border-color:#475569}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#1f2937;margin:4px 4px 0 0;font-size:12px}.near{background:#3f2f0d;color:#fde68a;border:1px solid #7c5f13}.pattern{background:#172554;color:#bfdbfe;border:1px solid #1d4ed8}.level{background:#052e2b;color:#99f6e4;border:1px solid #0f766e}.bull{color:#86efac}.bear{color:#fca5a5}.mixed{color:#fde68a}.score{font-size:24px;font-weight:700}.details{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #1f2937}.details.open{display:block}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.metric{background:#0b1020;border-radius:10px;padding:10px}.chartbox,.box{margin-top:14px;background:#0b1020;border:1px solid #1f2937;border-radius:12px;padding:12px}.spark{width:100%;height:220px;display:block}.chartlabels{display:flex;justify-content:space-between;color:#64748b;font-size:11px;margin-top:4px}.hint{margin-top:8px;font-size:12px;color:#94a3b8}.empty{padding:30px;text-align:center;color:#94a3b8}.footer{padding:20px 22px;color:#64748b;font-size:12px}@media(max-width:600px){.clock{text-align:left}.spark{height:170px}}
</style>
</head>
<body>
<header><div class="headrow"><div><h1>Stock Scanner</h1><div id="status" class="muted">Loading NSE scan…</div></div><div class="clock"><div id="liveTime">--:--:--</div><div id="liveDate" class="muted"></div></div></div></header>
<div class="tabs">
<button class="tabbtn active" data-tab="sma">SMA Scanner</button>
<button class="tabbtn" data-tab="candle">Candlestick Scanner</button>
<button class="tabbtn" data-tab="levels">Key Level Scanner</button>
</div>
<section id="sma" class="panel active"><div class="controls"><input id="smaQ" placeholder="Search symbol"><select id="trend"><option value="">All trends</option><option>Bullish</option><option>Bearish</option><option>Mixed</option></select><select id="smaNear"><option value="">All stocks</option><option value="20">Near SMA20</option><option value="50">Near SMA50</option><option value="200">Near SMA200</option></select><button class="reset" id="resetSma">Reset</button><button class="refresh">Refresh</button></div><div id="smaGrid" class="grid"></div></section>
<section id="candle" class="panel"><div class="controls"><input id="candleQ" placeholder="Search symbol"><select id="patternTf"><option value="">All TF</option><option>15m</option><option>30m</option><option>1H</option><option>2H</option><option>4H</option><option>1D</option><option>1W</option><option>1M</option></select><select id="patternName"><option value="">All candlestick patterns</option></select><button class="reset" id="resetCandle">Reset</button><button class="refresh">Refresh</button></div><div id="candleGrid" class="grid"></div></section>
<section id="levels" class="panel"><div class="controls"><input id="levelQ" placeholder="Search symbol"><select id="levelName"><option value="">All key levels</option><option>PDH</option><option>PDL</option><option>QO</option><option>PYH</option><option>PYL</option></select><select id="levelMode"><option value="">All</option><option value="near">Near selected level</option></select><button class="reset" id="resetLevels">Reset</button><button class="refresh">Refresh</button></div><div id="levelGrid" class="grid"></div></section>
<div class="footer">Source: NSE India. SMA, Candlestick and Key Level scanners are kept separate.</div>
<script>
let all=[];
const $=id=>document.getElementById(id);
function val(v,s=''){return v===null||v===undefined?'-':`${v}${s}`}
function cls(t){return t==='Bullish'?'bull':t==='Bearish'?'bear':'mixed'}
function sparkline(points){const r=(points||[]).filter(p=>Number.isFinite(Number(p.close)));if(r.length<2)return '<div class="empty">Chart unavailable.</div>';const w=1000,h=220,p=12,vs=r.map(x=>Number(x.close)),mn=Math.min(...vs),mx=Math.max(...vs),rg=(mx-mn)||1;const pts=vs.map((v,i)=>`${(p+i*(w-p*2)/(vs.length-1)).toFixed(1)},${(p+(mx-v)*(h-p*2)/rg).toFixed(1)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="4" vector-effect="non-scaling-stroke"/></svg><div class="chartlabels"><span>${r[0].date||''}</span><span>Low ₹${mn.toFixed(2)} · High ₹${mx.toFixed(2)}</span><span>${r[r.length-1].date||''}</span></div>`}
function baseDetails(x){return `<div class="metrics"><div class="metric"><div class="muted">Price</div><b>₹${val(x.price)}</b></div><div class="metric"><div class="muted">Open</div><b>₹${val(x.open)}</b></div><div class="metric"><div class="muted">Previous close</div><b>₹${val(x.previous_close)}</b></div><div class="metric"><div class="muted">Day high</div><b>₹${val(x.day_high)}</b></div><div class="metric"><div class="muted">Day low</div><b>₹${val(x.day_low)}</b></div><div class="metric"><div class="muted">VWAP</div><b>₹${val(x.vwap)}</b></div><div class="metric"><div class="muted">RSI 14</div><b>${val(x.rsi14)}</b></div><div class="metric"><div class="muted">Volume ratio</div><b>${val(x.volume_ratio,'x')}</b></div></div><div class="chartbox">${sparkline(x.chart)}</div>`}
function attach(grid){grid.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{const d=c.querySelector('.details');if(d)d.classList.toggle('open')}))}
function renderSma(){const q=$('smaQ').value.trim().toUpperCase(),t=$('trend').value,n=$('smaNear').value;const rows=all.filter(x=>(!q||x.symbol.includes(q))&&(!t||x.trend===t)&&(!n||(n==='20'&&x.near_sma20)||(n==='50'&&x.near_sma50)||(n==='200'&&x.near_sma200)));$('smaGrid').innerHTML=rows.length?rows.map(x=>`<div class="card"><div class="row"><div><h2 style="margin:0">${x.symbol}</h2><div class="${cls(x.trend)}">${x.trend}</div></div><div class="score">${x.score??0}</div></div><div class="row" style="margin-top:10px"><div>₹${val(x.price)}</div><div>SMA20 ${val(x.sma20)}</div><div>SMA50 ${val(x.sma50)}</div><div>SMA200 ${val(x.sma200)}</div></div><div class="hint">Click for details</div><div class="details">${baseDetails(x)}</div></div>`).join(''):'<div class="empty">No stocks match these SMA filters.</div>';attach($('smaGrid'))}
function buildPatterns(){const set=new Set();all.forEach(x=>Object.values(x.patterns||{}).forEach(v=>(v?.patterns||[]).forEach(p=>set.add(p))));const cur=$('patternName').value;$('patternName').innerHTML='<option value="">All candlestick patterns</option>'+[...set].sort().map(p=>`<option>${p}</option>`).join('');if([...set].includes(cur))$('patternName').value=cur}
function renderCandle(){const q=$('candleQ').value.trim().toUpperCase(),tf=$('patternTf').value,pn=$('patternName').value;const rows=all.filter(x=>{if(q&&!x.symbol.includes(q))return false;const ps=x.patterns||{};if(tf){const a=ps[tf]?.patterns||[];return pn?a.includes(pn):a.length>0}if(pn)return Object.values(ps).some(v=>(v?.patterns||[]).includes(pn));return Object.values(ps).some(v=>(v?.patterns||[]).length)});$('candleGrid').innerHTML=rows.length?rows.map(x=>{const tags=[];Object.entries(x.patterns||{}).forEach(([tf,v])=>(v?.patterns||[]).forEach(p=>tags.push(`${tf}: ${p}`)));const det=Object.entries(x.patterns||{}).map(([tf,v])=>`<div class="metric"><div class="muted">${tf}</div><b>${(v?.patterns||[]).join(', ')||'No pattern'}</b><div class="muted">${v?.candle?`O ${val(v.candle.open)} H ${val(v.candle.high)} L ${val(v.candle.low)} C ${val(v.candle.close)}`:'No candle data'}</div></div>`).join('');return `<div class="card"><div class="row"><div><h2 style="margin:0">${x.symbol}</h2><div>₹${val(x.price)}</div></div></div><div>${tags.map(t=>`<span class="tag pattern">${t}</span>`).join('')}</div><div class="hint">Click for candle details</div><div class="details"><div class="box"><div class="metrics">${det}</div></div>${baseDetails(x)}</div></div>`}).join(''):'<div class="empty">No candlestick pattern matches this filter.</div>';attach($('candleGrid'))}
function renderLevels(){const q=$('levelQ').value.trim().toUpperCase(),ln=$('levelName').value,mode=$('levelMode').value;const rows=all.filter(x=>{if(q&&!x.symbol.includes(q))return false;const lv=x.levels||{};if(!ln)return Object.keys(lv).length>0;if(!lv[ln])return false;if(mode==='near')return !!lv[ln].near;return true});$('levelGrid').innerHTML=rows.length?rows.map(x=>{const items=Object.entries(x.levels||{}).filter(([n])=>!ln||n===ln);return `<div class="card"><div class="row"><div><h2 style="margin:0">${x.symbol}</h2><div>₹${val(x.price)}</div></div></div><div>${items.map(([n,v])=>`<span class="tag level">${n} ₹${val(v.value)} · ${val(v.distance_pct,'%')}${v.near?' · NEAR':''}</span>`).join('')}</div><div class="hint">Click for key-level details</div><div class="details"><div class="metrics">${items.map(([n,v])=>`<div class="metric"><div class="muted">${n}</div><b>₹${val(v.value)}</b><div>${val(v.distance_pct,'%')} away ${v.near?'· Near':''}</div></div>`).join('')}</div>${baseDetails(x)}</div></div>`}).join(''):'<div class="empty">No stocks match this key-level filter.</div>';attach($('levelGrid'))}
function renderAll(){renderSma();renderCandle();renderLevels()}
function resetSma(){ $('smaQ').value='';$('trend').value='';$('smaNear').value='';renderSma() }
function resetCandle(){ $('candleQ').value='';$('patternTf').value='';$('patternName').value='';renderCandle() }
function resetLevels(){ $('levelQ').value='';$('levelName').value='';$('levelMode').value='';renderLevels() }
async function loadData(){$('status').textContent='Loading NSE scan…';try{const r=await fetch('data/results.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('data unavailable');const d=await r.json();all=Array.isArray(d.results)?d.results:[];buildPatterns();$('status').textContent=`NSE · ${all.length} stocks · Last scan ${new Date(d.updated_at).toLocaleString()}`;renderAll()}catch(e){$('status').textContent='NSE scan data unavailable.';['smaGrid','candleGrid','levelGrid'].forEach(id=>$(id).innerHTML='<div class="empty">Could not load scanner data.</div>')}}
document.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')}));
['smaQ','trend','smaNear'].forEach(id=>$(id).addEventListener('input',renderSma));['candleQ','patternTf','patternName'].forEach(id=>$(id).addEventListener('input',renderCandle));['levelQ','levelName','levelMode'].forEach(id=>$(id).addEventListener('input',renderLevels));document.querySelectorAll('.refresh').forEach(b=>b.addEventListener('click',loadData));$('resetSma').addEventListener('click',resetSma);$('resetCandle').addEventListener('click',resetCandle);$('resetLevels').addEventListener('click',resetLevels);
function tick(){const d=new Date();$('liveTime').textContent=d.toLocaleTimeString('en-IN',{hour12:true,timeZone:'Asia/Kolkata'});$('liveDate').textContent=d.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Kolkata'})}tick();setInterval(tick,1000);loadData();
</script>
</body></html>
