<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSE Fundamentals</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#0b1020;color:#eef2ff}header{padding:18px 22px;background:#111827;position:sticky;top:0;z-index:5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.controls{padding:16px 22px;display:flex;gap:10px;flex-wrap:wrap}select,input,button,a{padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#111827;color:#fff;text-decoration:none}.wrap{padding:0 22px 30px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}.card,.group{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:14px}.muted{color:#94a3b8}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.group h3{margin-top:0}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid #1f2937;padding:7px 0}.kv b{text-align:right;word-break:break-word}.empty{padding:30px;text-align:center;color:#94a3b8}@media(max-width:600px){.kv{grid-template-columns:1fr}.kv b{text-align:left}}
</style></head><body>
<header><div class="row"><div><h1 style="margin:0">Fundamentals</h1><div class="muted">NSE company metadata, valuation and security information</div></div><a href="./">← Scanner</a></div></header>
<div class="controls"><input id="q" placeholder="Search symbol"><select id="symbol"></select><button id="refresh">Refresh</button></div><div id="status" class="wrap muted"></div><main id="content" class="wrap"></main>
<script>
let ext={},results=[];const $=id=>document.getElementById(id);function nice(k){return String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ').replace(/^./,m=>m.toUpperCase())}function val(v){return v===null||v===undefined||v===''?'-':String(v)}
function important(f){const all={...(f.metadata||{}),...(f.info||{}),...(f.securityInfo||{}),...(f.industryInfo||{})};const pick=(...ks)=>{for(const k of ks)if(all[k]!==undefined&&all[k]!==null&&all[k]!=='')return all[k];return '-'};return [ ['Company',pick('companyName','companyNameLong','symbol')],['Industry',pick('industry','basicIndustry','industryInfo')],['Symbol P/E',pick('pdSymbolPe','symbolPe','pe')],['Sector P/E',pick('pdSectorPe','sectorPe')],['Face value',pick('faceValue')],['ISIN',pick('isin','isinCode')],['Listing date',pick('listingDate')],['F&O',pick('isFNOSec','isFNO')]]}
function render(){const sym=$('symbol').value,d=ext.data?.[sym];if(!d){$('content').innerHTML='<div class="empty">Fundamental data unavailable.</div>';return}const f=d.fundamentals||{};const cards=important(f).map(([k,v])=>`<div class="card"><div class="muted">${k}</div><b>${val(v)}</b></div>`).join('');const groups=Object.entries(f).map(([name,obj])=>{const rows=Object.entries(obj||{}).filter(([,v])=>v!==null&&v!==''&&typeof v!=='object').map(([k,v])=>`<div class="kv"><span>${nice(k)}</span><b>${val(v)}</b></div>`).join('');return `<section class="group"><h3>${nice(name)}</h3>${rows||'<div class="muted">No data</div>'}</section>`}).join('');$('content').innerHTML=`<div class="cards">${cards}</div><div class="groups">${groups}</div>`}
function filter(){const q=$('q').value.trim().toUpperCase();const syms=Object.keys(ext.data||{}).filter(s=>!q||s.includes(q));const cur=$('symbol').value;$('symbol').innerHTML=syms.map(s=>`<option>${s}</option>`).join('');if(syms.includes(cur))$('symbol').value=cur;render()}
async function load(){try{const r=await fetch('data/extended.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();ext=await r.json();$('status').textContent=`Source: ${ext.source||'NSE India'} · Updated ${ext.updated_at?new Date(ext.updated_at).toLocaleString():'-'}`;filter()}catch(e){$('status').textContent='Fundamental data has not been generated yet.';$('content').innerHTML='<div class="empty">Run the scanner workflow to generate fundamentals.</div>'}}
$('q').oninput=filter;$('symbol').onchange=render;$('refresh').onclick=load;load();
</script></body></html>
