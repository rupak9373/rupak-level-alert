<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSE Fundamental Scanner</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#0b1020;color:#eef2ff}header{padding:18px 22px;background:#111827;position:sticky;top:0;z-index:5}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.controls,.filters{padding:14px 22px;display:flex;gap:10px;flex-wrap:wrap}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));align-items:end}.f{display:flex;flex-direction:column;gap:5px}.f label{font-size:12px;color:#94a3b8}.range{display:grid;grid-template-columns:1fr 1fr;gap:6px}select,input,button,a{padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#111827;color:#fff;text-decoration:none;min-width:0}.wrap{padding:0 22px 30px}.summary{padding:0 22px 12px;color:#94a3b8}.grid{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card,.group{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:14px}.card h2{margin:0 0 4px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.metric{background:#0b1020;border-radius:10px;padding:9px}.metric .muted{font-size:11px}.muted{color:#94a3b8}.good{color:#86efac}.warn{color:#fde68a}.reset{border-color:#7f1d1d;color:#fecaca}.empty{padding:30px;text-align:center;color:#94a3b8}.detail{margin-top:10px;border-top:1px solid #1f2937;padding-top:10px}.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12px}.kv b{text-align:right}.chip{display:inline-block;padding:4px 7px;border-radius:999px;background:#172554;color:#bfdbfe;margin:3px 3px 0 0;font-size:11px}@media(max-width:600px){.metrics{grid-template-columns:1fr}.range{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="row"><div><h1 style="margin:0">Fundamental Scanner</h1><div class="muted">Use multiple filters together. Example: Promoter holding minimum 60%.</div></div><a href="./">← Scanner</a></div></header>
<div class="controls"><input id="q" placeholder="Search symbol/company"><select id="industry"><option value="">All industries</option></select><select id="fno"><option value="">F&O: Any</option><option value="yes">F&O only</option><option value="no">Non-F&O only</option></select><button id="reset" class="reset">Reset filters</button><button id="refresh">Refresh</button></div>
<div class="filters">
<div class="f"><label>Promoter holding %</label><div class="range"><input id="promMin" type="number" step="0.01" placeholder="Min e.g. 60"><input id="promMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>Change in promoter holding %</label><div class="range"><input id="promChMin" type="number" step="0.01" placeholder="Min"><input id="promChMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>FII holding %</label><div class="range"><input id="fiiMin" type="number" step="0.01" placeholder="Min"><input id="fiiMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>DII holding %</label><div class="range"><input id="diiMin" type="number" step="0.01" placeholder="Min"><input id="diiMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>Public holding %</label><div class="range"><input id="pubMin" type="number" step="0.01" placeholder="Min"><input id="pubMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>Stock P/E</label><div class="range"><input id="peMin" type="number" step="0.01" placeholder="Min"><input id="peMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>Sector P/E</label><div class="range"><input id="sectorPeMin" type="number" step="0.01" placeholder="Min"><input id="sectorPeMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>Market cap ₹ Cr</label><div class="range"><input id="mcMin" type="number" step="1" placeholder="Min"><input id="mcMax" type="number" step="1" placeholder="Max"></div></div>
<div class="f"><label>ROCE %</label><div class="range"><input id="roceMin" type="number" step="0.01" placeholder="Min"><input id="roceMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>ROE %</label><div class="range"><input id="roeMin" type="number" step="0.01" placeholder="Min"><input id="roeMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>Dividend yield %</label><div class="range"><input id="divMin" type="number" step="0.01" placeholder="Min"><input id="divMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>Book value ₹</label><div class="range"><input id="bvMin" type="number" step="0.01" placeholder="Min"><input id="bvMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>Current price ₹</label><div class="range"><input id="priceMin" type="number" step="0.01" placeholder="Min"><input id="priceMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="f"><label>Face value ₹</label><div class="range"><input id="faceMin" type="number" step="0.01" placeholder="Min"><input id="faceMax" type="number" step="0.01" placeholder="Max"></div></div>
</div>
<div id="status" class="summary"></div><div id="count" class="summary"></div><main id="grid" class="grid"></main>
<script>
let ext={};const $=id=>document.getElementById(id);const ids=['q','industry','fno','promMin','promMax','promChMin','promChMax','fiiMin','fiiMax','diiMin','diiMax','pubMin','pubMax','peMin','peMax','sectorPeMin','sectorPeMax','mcMin','mcMax','roceMin','roceMax','roeMin','roeMax','divMin','divMax','bvMin','bvMax','priceMin','priceMax','faceMin','faceMax'];
function v(x){return x===null||x===undefined||x===''?'-':x}function n(x){const z=Number(x);return Number.isFinite(z)?z:null}function inRange(value,minId,maxId){const x=n(value),mn=n($(minId).value),mx=n($(maxId).value);if(mn!==null&&(x===null||x<mn))return false;if(mx!==null&&(x===null||x>mx))return false;return true}
function metric(m,k,label,suffix=''){return `<div class="metric"><div class="muted">${label}</div><b>${v(m[k])}${m[k]===null||m[k]===undefined?'':suffix}</b></div>`}
function matches(sym,d){const m=d.screen_metrics||{},q=$('q').value.trim().toUpperCase(),ind=$('industry').value,fno=$('fno').value;if(q&&!sym.includes(q)&&!String(m.company||'').toUpperCase().includes(q))return false;if(ind&&m.industry!==ind)return false;if(fno==='yes'&&!m.is_fno)return false;if(fno==='no'&&m.is_fno)return false;return inRange(m.promoter_holding,'promMin','promMax')&&inRange(m.promoter_change,'promChMin','promChMax')&&inRange(m.fii_holding,'fiiMin','fiiMax')&&inRange(m.dii_holding,'diiMin','diiMax')&&inRange(m.public_holding,'pubMin','pubMax')&&inRange(m.stock_pe,'peMin','peMax')&&inRange(m.sector_pe,'sectorPeMin','sectorPeMax')&&inRange(m.market_cap_cr,'mcMin','mcMax')&&inRange(m.roce,'roceMin','roceMax')&&inRange(m.roe,'roeMin','roeMax')&&inRange(m.dividend_yield,'divMin','divMax')&&inRange(m.book_value,'bvMin','bvMax')&&inRange(m.current_price,'priceMin','priceMax')&&inRange(m.face_value,'faceMin','faceMax')}
function card(sym,d){const m=d.screen_metrics||{},p=n(m.promoter_holding);return `<article class="card"><div class="row"><div><h2>${sym}</h2><div class="muted">${v(m.company)}</div></div><span class="chip">${v(m.industry)}</span></div><div class="metrics">${metric(m,'promoter_holding','Promoter','%')}${metric(m,'promoter_change','Promoter change','%')}${metric(m,'fii_holding','FII','%')}${metric(m,'dii_holding','DII','%')}${metric(m,'stock_pe','P/E')}${metric(m,'market_cap_cr','Market cap',' Cr')}${metric(m,'roce','ROCE','%')}${metric(m,'roe','ROE','%')}${metric(m,'dividend_yield','Dividend yield','%')}${metric(m,'book_value','Book value','')}${metric(m,'current_price','Price','')}${metric(m,'sector_pe','Sector P/E','')}</div><div class="detail"><div class="kv"><span>Public holding</span><b>${v(m.public_holding)}${m.public_holding==null?'':'%'}</b></div><div class="kv"><span>Face value</span><b>${v(m.face_value)}</b></div><div class="kv"><span>52W High / Low</span><b>${v(m.high_52w)} / ${v(m.low_52w)}</b></div><div class="kv"><span>F&O</span><b>${m.is_fno?'Yes':'No'}</b></div><div class="kv"><span>ISIN</span><b>${v(m.isin)}</b></div><div class="kv"><span>Listing date</span><b>${v(m.listing_date)}</b></div></div></article>`}
function render(){const rows=Object.entries(ext.data||{}).filter(([s,d])=>matches(s,d));rows.sort((a,b)=>(n(b[1].screen_metrics?.promoter_holding)??-999)-(n(a[1].screen_metrics?.promoter_holding)??-999));$('count').textContent=`${rows.length} matching stocks out of ${Object.keys(ext.data||{}).length} loaded stocks`;if(!rows.length){$('grid').innerHTML='<div class="empty">No stock matches all selected fundamental filters.</div>';return}$('grid').innerHTML=rows.map(([s,d])=>card(s,d)).join('')}
function industries(){const set=[...new Set(Object.values(ext.data||{}).map(d=>d.screen_metrics?.industry).filter(Boolean))].sort();$('industry').innerHTML='<option value="">All industries</option>'+set.map(x=>`<option>${x}</option>`).join('')}
function reset(){ids.forEach(id=>{if(id==='industry'||id==='fno'||id==='q')$(id).value='';else $(id).value=''});render()}
async function load(){try{const r=await fetch('data/extended.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();ext=await r.json();$('status').textContent=`Source: ${ext.source||'NSE India'} · Updated ${ext.updated_at?new Date(ext.updated_at).toLocaleString():'-'}`;industries();render()}catch(e){$('status').textContent='Fundamental data has not been generated yet.';$('grid').innerHTML='<div class="empty">Fundamental data unavailable.</div>'}}
ids.forEach(id=>$(id).addEventListener('input',render));$('reset').onclick=reset;$('refresh').onclick=load;load();
</script></body></html>
