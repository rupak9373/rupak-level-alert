<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSE Fundamental Scanner</title><style>
:root{--bg:#08111f;--panel:#0e1a2b;--panel2:#111f33;--line:#22314a;--muted:#91a0b8;--text:#eef4ff;--accent:#4f8cff;--accent2:#8b5cf6;--good:#52d273;--warn:#f4c85a;--danger:#ff7a7a}
*{box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;margin:0;background:linear-gradient(180deg,#07101c 0%,#0a1322 100%);color:var(--text)}header{padding:18px 22px;background:rgba(9,17,30,.95);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.titlewrap h1{margin:0;font-size:26px}.subtitle{margin-top:5px;color:var(--muted);font-size:13px}.back{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:#fff;text-decoration:none}.shell{max-width:1500px;margin:0 auto}.toolbar{margin:16px 22px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:minmax(180px,1.3fr) minmax(180px,1fr) minmax(150px,.8fr) auto auto;gap:10px;align-items:end}.field{display:flex;flex-direction:column;gap:6px}.field label,.rangeField label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8ea0ba;font-weight:700}.toolbar input,.toolbar select,.filters input,.filters select,button{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #2a3a55;background:#0a1424;color:#fff;outline:none}.toolbar input:focus,.toolbar select:focus,.filters input:focus,.filters select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.12)}button{cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0}.secondary{background:#132136}.reset{color:#ffd0d0;border-color:#5d2a37;background:#1d1520}.filterCard{margin:14px 22px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.filterHead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.filterHead h3{margin:0;font-size:15px}.filterHint{color:var(--muted);font-size:12px}.filters{padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.rangeField{background:#0a1424;border:1px solid #1c2a40;border-radius:12px;padding:11px}.range{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}.quick{margin:12px 22px 0;display:flex;gap:8px;flex-wrap:wrap}.quick button{width:auto;padding:8px 11px;font-size:12px;background:#12223a;border-color:#274160}.quick button:hover{border-color:var(--accent)}.summarybar{margin:12px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.countStrong{color:#fff;font-weight:700}.grid{padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{background:linear-gradient(180deg,#0f1c2f 0%,#0c1727 100%);border:1px solid #1d2d45;border-radius:16px;padding:16px;transition:.18s ease}.card:hover{transform:translateY(-2px);border-color:#36537d;box-shadow:0 10px 30px rgba(0,0,0,.16)}.cardTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.symbol{font-size:20px;font-weight:800;margin:0}.company{color:var(--muted);font-size:12px;margin-top:3px;min-height:16px}.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.chip{padding:5px 8px;border-radius:999px;background:#152944;color:#bdd4ff;border:1px solid #27456b;font-size:10px;font-weight:700}.chip.fno{background:#1b2b20;color:#9cf0ae;border-color:#31593a}.heroMetrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.hero{background:#0a1424;border:1px solid #192840;border-radius:11px;padding:10px}.hero .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.hero .num{font-size:17px;font-weight:800;margin-top:3px}.hero.prom .num{color:#95e8aa}.metricGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.metric{display:flex;justify-content:space-between;gap:10px;background:#0b1626;border:1px solid #192840;border-radius:10px;padding:9px 10px;font-size:12px}.metric span{color:var(--muted)}.metric b{text-align:right}.details{margin-top:10px;padding-top:10px;border-top:1px solid #1d2d45}.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:11px}.kv span{color:var(--muted)}.kv b{text-align:right;word-break:break-word}.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed #2a3a55;border-radius:14px}.statusDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px}@media(max-width:900px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}.heroMetrics{grid-template-columns:1fr 1fr 1fr}}@media(max-width:600px){header{padding:15px}.toolbar,.filterCard,.quick,.summarybar{margin-left:12px;margin-right:12px}.toolbar{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.grid{padding:0 12px 24px;grid-template-columns:1fr}.heroMetrics{grid-template-columns:1fr 1fr}.titlewrap h1{font-size:22px}.card{padding:14px}}
</style></head><body><div class="shell">
<header><div class="top"><div class="titlewrap"><h1>Fundamental Scanner</h1><div class="subtitle">Filter strong businesses quickly — promoter holding, valuation, ROCE, ROE, ownership and more.</div></div><a class="back" href="./">← Back to Scanner</a></div></header>
<section class="toolbar">
<div class="field wide"><label>Search</label><input id="q" placeholder="Search symbol or company"></div>
<div class="field"><label>Industry</label><select id="industry"><option value="">All industries</option></select></div>
<div class="field"><label>F&O</label><select id="fno"><option value="">Any</option><option value="yes">F&O only</option><option value="no">Non-F&O only</option></select></div>
<button id="reset" class="reset">Reset</button><button id="refresh" class="primary">Refresh</button>
</section>
<div class="quick"><button data-preset="prom60">Promoter ≥ 60%</button><button data-preset="quality">ROCE ≥ 20% + ROE ≥ 15%</button><button data-preset="value">P/E ≤ 25</button><button data-preset="fii">FII ≥ 10%</button><button data-preset="fno">F&O only</button></div>
<section class="filterCard"><div class="filterHead"><div><h3>Advanced Filters</h3><div class="filterHint">All selected filters work together using AND logic.</div></div></div><div class="filters">
<div class="rangeField"><label>Promoter Holding %</label><div class="range"><input id="promMin" type="number" step="0.01" placeholder="Min"><input id="promMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>Promoter Change %</label><div class="range"><input id="promChMin" type="number" step="0.01" placeholder="Min"><input id="promChMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>FII Holding %</label><div class="range"><input id="fiiMin" type="number" step="0.01" placeholder="Min"><input id="fiiMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>DII Holding %</label><div class="range"><input id="diiMin" type="number" step="0.01" placeholder="Min"><input id="diiMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>Public Holding %</label><div class="range"><input id="pubMin" type="number" step="0.01" placeholder="Min"><input id="pubMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>Stock P/E</label><div class="range"><input id="peMin" type="number" step="0.01" placeholder="Min"><input id="peMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>Sector P/E</label><div class="range"><input id="sectorPeMin" type="number" step="0.01" placeholder="Min"><input id="sectorPeMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>Market Cap ₹ Cr</label><div class="range"><input id="mcMin" type="number" step="1" placeholder="Min"><input id="mcMax" type="number" step="1" placeholder="Max"></div></div>
<div class="rangeField"><label>ROCE %</label><div class="range"><input id="roceMin" type="number" step="0.01" placeholder="Min"><input id="roceMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>ROE %</label><div class="range"><input id="roeMin" type="number" step="0.01" placeholder="Min"><input id="roeMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>Dividend Yield %</label><div class="range"><input id="divMin" type="number" step="0.01" placeholder="Min"><input id="divMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>Book Value ₹</label><div class="range"><input id="bvMin" type="number" step="0.01" placeholder="Min"><input id="bvMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>Current Price ₹</label><div class="range"><input id="priceMin" type="number" step="0.01" placeholder="Min"><input id="priceMax" type="number" step="0.01" placeholder="Max"></div></div>
<div class="rangeField"><label>Face Value ₹</label><div class="range"><input id="faceMin" type="number" step="0.01" placeholder="Min"><input id="faceMax" type="number" step="0.01" placeholder="Max"></div></div>
</div></section>
<div class="summarybar"><div id="status"><span class="statusDot"></span>Loading fundamental data…</div><div id="count" class="countStrong"></div></div><main id="grid" class="grid"></main>
<script>
let ext={};const $=id=>document.getElementById(id);const ids=['q','industry','fno','promMin','promMax','promChMin','promChMax','fiiMin','fiiMax','diiMin','diiMax','pubMin','pubMax','peMin','peMax','sectorPeMin','sectorPeMax','mcMin','mcMax','roceMin','roceMax','roeMin','roeMax','divMin','divMax','bvMin','bvMax','priceMin','priceMax','faceMin','faceMax'];
function v(x){return x===null||x===undefined||x===''?'-':x}function n(x){const z=Number(x);return Number.isFinite(z)?z:null}function fmt(x,d=2){const z=n(x);return z===null?'-':z.toLocaleString('en-IN',{maximumFractionDigits:d})}function inRange(value,minId,maxId){const x=n(value),mn=n($(minId).value),mx=n($(maxId).value);if(mn!==null&&(x===null||x<mn))return false;if(mx!==null&&(x===null||x>mx))return false;return true}
function matches(sym,d){const m=d.screen_metrics||{},q=$('q').value.trim().toUpperCase(),ind=$('industry').value,fno=$('fno').value;if(q&&!sym.includes(q)&&!String(m.company||'').toUpperCase().includes(q))return false;if(ind&&m.industry!==ind)return false;if(fno==='yes'&&!m.is_fno)return false;if(fno==='no'&&m.is_fno)return false;return inRange(m.promoter_holding,'promMin','promMax')&&inRange(m.promoter_change,'promChMin','promChMax')&&inRange(m.fii_holding,'fiiMin','fiiMax')&&inRange(m.dii_holding,'diiMin','diiMax')&&inRange(m.public_holding,'pubMin','pubMax')&&inRange(m.stock_pe,'peMin','peMax')&&inRange(m.sector_pe,'sectorPeMin','sectorPeMax')&&inRange(m.market_cap_cr,'mcMin','mcMax')&&inRange(m.roce,'roceMin','roceMax')&&inRange(m.roe,'roeMin','roeMax')&&inRange(m.dividend_yield,'divMin','divMax')&&inRange(m.book_value,'bvMin','bvMax')&&inRange(m.current_price,'priceMin','priceMax')&&inRange(m.face_value,'faceMin','faceMax')}
function kv(label,value){return `<div class="kv"><span>${label}</span><b>${value}</b></div>`}function metric(label,value){return `<div class="metric"><span>${label}</span><b>${value}</b></div>`}
function card(sym,d){const m=d.screen_metrics||{};return `<article class="card"><div class="cardTop"><div><h2 class="symbol">${sym}</h2><div class="company">${v(m.company)}</div></div><div class="chips"><span class="chip">${v(m.industry)}</span>${m.is_fno?'<span class="chip fno">F&O</span>':''}</div></div><div class="heroMetrics"><div class="hero prom"><div class="lbl">Promoter</div><div class="num">${fmt(m.promoter_holding)}${m.promoter_holding==null?'':'%'}</div></div><div class="hero"><div class="lbl">ROCE</div><div class="num">${fmt(m.roce)}${m.roce==null?'':'%'}</div></div><div class="hero"><div class="lbl">P/E</div><div class="num">${fmt(m.stock_pe)}</div></div></div><div class="metricGrid">${metric('ROE',fmt(m.roe)+(m.roe==null?'':'%'))}${metric('Market Cap','₹'+fmt(m.market_cap_cr,0)+' Cr')}${metric('FII',fmt(m.fii_holding)+(m.fii_holding==null?'':'%'))}${metric('DII',fmt(m.dii_holding)+(m.dii_holding==null?'':'%'))}${metric('Dividend',fmt(m.dividend_yield)+(m.dividend_yield==null?'':'%'))}${metric('Price','₹'+fmt(m.current_price))}${metric('Book Value','₹'+fmt(m.book_value))}${metric('Sector P/E',fmt(m.sector_pe))}</div><div class="details">${kv('Promoter change',fmt(m.promoter_change)+(m.promoter_change==null?'':'%'))}${kv('Public holding',fmt(m.public_holding)+(m.public_holding==null?'':'%'))}${kv('52W High / Low','₹'+fmt(m.high_52w)+' / ₹'+fmt(m.low_52w))}${kv('Face value','₹'+fmt(m.face_value))}${kv('ISIN',v(m.isin))}${kv('Listing date',v(m.listing_date))}</div></article>`}
function render(){const rows=Object.entries(ext.data||{}).filter(([s,d])=>matches(s,d));rows.sort((a,b)=>(n(b[1].screen_metrics?.promoter_holding)??-999)-(n(a[1].screen_metrics?.promoter_holding)??-999));$('count').textContent=`${rows.length} matching / ${Object.keys(ext.data||{}).length} loaded`;if(!rows.length){$('grid').innerHTML='<div class="empty">No stocks match all selected filters.</div>';return}$('grid').innerHTML=rows.map(([s,d])=>card(s,d)).join('')}
function industries(){const set=[...new Set(Object.values(ext.data||{}).map(d=>d.screen_metrics?.industry).filter(Boolean))].sort();$('industry').innerHTML='<option value="">All industries</option>'+set.map(x=>`<option>${x}</option>`).join('')}
function reset(){ids.forEach(id=>$(id).value='');render()}
function preset(name){reset();if(name==='prom60')$('promMin').value='60';if(name==='quality'){$('roceMin').value='20';$('roeMin').value='15'}if(name==='value')$('peMax').value='25';if(name==='fii')$('fiiMin').value='10';if(name==='fno')$('fno').value='yes';render()}
async function load(){try{const r=await fetch('data/extended.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();ext=await r.json();$('status').innerHTML=`<span class="statusDot"></span>${ext.source||'NSE India'} · Updated ${ext.updated_at?new Date(ext.updated_at).toLocaleString():'-'}`;industries();render()}catch(e){$('status').textContent='Fundamental data unavailable.';$('grid').innerHTML='<div class="empty">Fundamental data has not been generated yet.</div>'}}
ids.forEach(id=>$(id).addEventListener('input',render));document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>preset(b.dataset.preset)));$('reset').onclick=reset;$('refresh').onclick=load;load();
</script></div></body></html>
