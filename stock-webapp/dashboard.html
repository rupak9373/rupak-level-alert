<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock Scanner</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#0b1020;color:#eef2ff}header{padding:18px 22px;background:#111827;position:sticky;top:0;z-index:10}.head,.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.muted{color:#94a3b8}.tabs,.controls{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px}.tab,input,select,button,a.tab{padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#111827;color:#fff;text-decoration:none}.tab.active{background:#172554;border-color:#60a5fa}.panel{display:none}.panel.active{display:block}.grid{padding:0 22px 30px;display:grid;gap:12px}.card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:16px;cursor:pointer}.card:hover{border-color:#475569}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#1f2937;margin:4px 4px 0 0;font-size:12px}.near{color:#fde68a}.pattern{color:#bfdbfe}.level{color:#99f6e4}.bull{color:#86efac}.bear{color:#fca5a5}.mixed{color:#fde68a}.details{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #1f2937}.details.open{display:block}.metrics,.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.metric{background:#0b1020;border-radius:10px;padding:10px}.chartbox{margin-top:14px;background:#0b1020;border:1px solid #1f2937;border-radius:12px;padding:12px}.spark{width:100%;height:230px;display:block}.chartlabels{display:flex;justify-content:space-between;color:#64748b;font-size:11px}.empty{padding:30px;text-align:center;color:#94a3b8}.tablewrap{padding:0 22px 30px;overflow:auto}.octable{width:100%;border-collapse:collapse;min-width:1100px;background:#111827}.octable th,.octable td{padding:8px;border-bottom:1px solid #1f2937;text-align:right;font-size:12px}.octable .strike{text-align:center;font-weight:700}.octable tr.atm .strike{background:#78350f}.footer{padding:20px 22px;color:#64748b;font-size:12px}@media(max-width:600px){.spark{height:180px}}
</style></head><body>
<header><div class="head"><div><h1 style="margin:0">Stock Scanner</h1><div id="status" class="muted">Loading…</div></div><div><div id="clock"></div><div id="date" class="muted"></div></div></div></header>
<div class="tabs"><button class="tab active" data-tab="combined">Combined</button><button class="tab" data-tab="sma">SMA</button><button class="tab" data-tab="candle">Candlestick</button><button class="tab" data-tab="levels">Key Levels</button><button class="tab" data-tab="options">Option Chain</button><a class="tab" href="fundamentals.html">Fundamentals ↗</a></div>
<section id="combined" class="panel active"><div class="controls"><input id="cq" placeholder="Search"><select id="ctr"><option value="">Any trend</option><option>Bullish</option><option>Bearish</option><option>Mixed</option></select><select id="cstf"><option value="">Any SMA TF</option><option>15m</option><option>30m</option><option>1H</option><option>2H</option><option>4H</option><option>1D</option><option>1W</option><option>1M</option></select><select id="cslen"><option value="">Any SMA</option><option>20</option><option>50</option><option>200</option></select><select id="cscond"><option value="">Any SMA condition</option><option value="above">Above</option><option value="below">Below</option><option value="near">Near ≤1%</option></select><select id="cctf"><option value="">Any candle TF</option><option>15m</option><option>30m</option><option>1H</option><option>2H</option><option>4H</option><option>1D</option><option>1W</option><option>1M</option></select><select id="cpat"><option value="">Any pattern</option></select><select id="clevel"><option value="">Any level</option><option>PDH</option><option>PDL</option><option>QO</option><option>PYH</option><option>PYL</option><option value="52WH">52W High</option><option value="52WL">52W Low</option></select><select id="clcond"><option value="">Any level condition</option><option value="near">Near ≤1%</option></select><button id="creset">Reset</button></div><div id="combinedGrid" class="grid"></div></section>
<section id="sma" class="panel"><div class="controls"><input id="sq" placeholder="Search"><select id="stf"><option>15m</option><option>30m</option><option>1H</option><option>2H</option><option>4H</option><option selected>1D</option><option>1W</option><option>1M</option></select><select id="slen"><option>20</option><option>50</option><option>200</option></select><select id="scond"><option value="">All</option><option value="above">Above</option><option value="below">Below</option><option value="near">Near ≤1%</option></select></div><div id="smaGrid" class="grid"></div></section>
<section id="candle" class="panel"><div class="controls"><input id="pq" placeholder="Search"><select id="ptf"><option value="">All TF</option><option>15m</option><option>30m</option><option>1H</option><option>2H</option><option>4H</option><option>1D</option><option>1W</option><option>1M</option></select><select id="pname"><option value="">All patterns</option></select></div><div id="candleGrid" class="grid"></div></section>
<section id="levels" class="panel"><div class="controls"><input id="lq" placeholder="Search"><select id="lname"><option value="">All levels</option><option>PDH</option><option>PDL</option><option>QO</option><option>PYH</option><option>PYL</option><option value="52WH">52W High</option><option value="52WL">52W Low</option></select><select id="lmode"><option value="">All</option><option value="near">Only near</option></select><select id="lpct"><option>.25</option><option>.5</option><option selected>1</option><option>2</option></select></div><div id="levelGrid" class="grid"></div></section>
<section id="options" class="panel"><div class="controls"><select id="ocs"></select><select id="oce"></select><select id="ocr"><option value="all">All strikes</option><option value="10">ATM ±10</option><option value="5">ATM ±5</option></select><button id="ocrf">Refresh</button></div><div id="ocstatus" class="footer"></div><div id="ocstats" class="stats" style="padding:0 22px 14px"></div><div id="octable" class="tablewrap"></div></section>
<div class="footer">Source: NSE India. Reliable chart TF data: 1D, 1W, 1M. Intraday chart options are shown but remain unavailable until a reliable historical intraday OHLC feed is connected.</div>
<script>
let all=[],ext={},oc={};const $=id=>document.getElementById(id);const TFS=['15m','30m','1H','2H','4H','1D','1W','1M'];const P=['Morning Star','Evening Star','Bullish Engulfing','Bearish Engulfing','Piercing Line','Dark Cloud Cover','Hammer','Hanging Man','Inverted Hammer','Shooting Star','Bullish Harami','Bearish Harami','Bullish Marubozu','Bearish Marubozu','Doji'];
const val=(v,s='')=>v===null||v===undefined?'-':`${v}${s}`;const primary=v=>{const a=v?.patterns||[];return P.find(x=>a.includes(x))||a[0]||''};const cls=t=>t==='Bullish'?'bull':t==='Bearish'?'bear':'mixed';
function sma(x,tf){return x.sma_by_tf?.[tf]||{}}function smaMatch(x,tf,len,c){if(!tf||!len||!c)return true;const i=sma(x,tf),v=Number(i[`sma${len}`]);if(!Number.isFinite(v))return false;if(c==='near')return !!i[`near_sma${len}`];return c==='above'?Number(x.price)>v:Number(x.price)<v}function patMatch(x,tf,p){if(tf){const q=primary(x.patterns?.[tf]);return p?q===p:!!q}if(p)return Object.values(x.patterns||{}).some(v=>primary(v)===p);return true}function levMatch(x,n,c,t=1){if(!n&&!c)return true;if(n&&!x.levels?.[n])return false;if(c==='near'){if(n)return Number(x.levels[n]?.distance_pct)<=t;return Object.values(x.levels||{}).some(v=>Number(v.distance_pct)<=t)}return true}
function points(x,tf){if(ext.data?.[x.symbol]?.charts?.[tf])return ext.data[x.symbol].charts[tf];if(tf==='1D')return x.chart||[];return []}
function lineChart(r){r=(r||[]).filter(x=>Number.isFinite(Number(x.close)));if(r.length<2)return '<div class="empty">This timeframe is unavailable from the current NSE feed.</div>';const w=1000,h=230,p=12,v=r.map(x=>+x.close),mn=Math.min(...v),mx=Math.max(...v),rg=mx-mn||1,pts=v.map((z,i)=>`${p+i*(w-p*2)/(v.length-1)},${p+(mx-z)*(h-p*2)/rg}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="4" vector-effect="non-scaling-stroke"/></svg><div class="chartlabels"><span>${r[0].date}</span><span>Low ₹${mn.toFixed(2)} · High ₹${mx.toFixed(2)}</span><span>${r.at(-1).date}</span></div>`}
function candleChart(r){r=(r||[]).filter(x=>['open','high','low','close'].every(k=>Number.isFinite(Number(x[k]))));if(r.length<2)return '<div class="empty">This timeframe is unavailable from the current NSE feed.</div>';const w=1000,h=230,p=12,hi=Math.max(...r.map(x=>+x.high)),lo=Math.min(...r.map(x=>+x.low)),rg=hi-lo||1,step=(w-p*2)/r.length,bw=Math.max(3,step*.55);let s='';r.forEach((x,i)=>{const o=+x.open,c=+x.close,hh=+x.high,ll=+x.low,cx=p+i*step+step/2,y=v=>p+(hi-v)*(h-p*2)/rg,yo=y(o),yc=y(c),col=c>=o?'#22c55e':'#ef4444';s+=`<line x1="${cx}" y1="${y(hh)}" x2="${cx}" y2="${y(ll)}" stroke="${col}" stroke-width="2"/><rect x="${cx-bw/2}" y="${Math.min(yo,yc)}" width="${bw}" height="${Math.max(2,Math.abs(yo-yc))}" fill="${col}"/>`});return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${s}</svg><div class="chartlabels"><span>${r[0].date}</span><span>${r.length} bars</span><span>${r.at(-1).date}</span></div>`}
function chartBox(x){return `<div class="chartbox" data-symbol="${x.symbol}"><div class="row"><b>${x.symbol} chart</b><div><select class="ctf">${TFS.map(t=>`<option ${t==='1D'?'selected':''}>${t}</option>`).join('')}</select> <select class="cmode"><option value="candle">Candles</option><option value="line">Line</option></select></div></div><div class="carea">${candleChart(points(x,'1D'))}</div></div>`}
function details(x){return `<div class="metrics"><div class="metric">Price<br><b>₹${val(x.price)}</b></div><div class="metric">Open<br><b>₹${val(x.open)}</b></div><div class="metric">Prev close<br><b>₹${val(x.previous_close)}</b></div><div class="metric">Day high<br><b>₹${val(x.day_high)}</b></div><div class="metric">Day low<br><b>₹${val(x.day_low)}</b></div><div class="metric">52W high<br><b>₹${val(x.week52_high)}</b></div><div class="metric">52W low<br><b>₹${val(x.week52_low)}</b></div><div class="metric">RSI14<br><b>${val(x.rsi14)}</b></div></div>${chartBox(x)}`}
function card(x,b=''){return `<div class="card"><div class="row"><div><h2 style="margin:0">${x.symbol}</h2><span class="${cls(x.trend)}">${x.trend} · ₹${val(x.price)}</span></div><b>${x.score??0}</b></div><div>${b}</div><div class="muted" style="margin-top:8px">Click for data + timeframe chart</div><div class="details">${details(x)}</div></div>`}
function wire(g){g.querySelectorAll('.card').forEach(c=>c.onclick=e=>{if(e.target.matches('select,option'))return;c.querySelector('.details')?.classList.toggle('open')});g.querySelectorAll('.chartbox').forEach(box=>{const draw=()=>{const x=all.find(a=>a.symbol===box.dataset.symbol),tf=box.querySelector('.ctf').value,m=box.querySelector('.cmode').value,r=points(x,tf);box.querySelector('.carea').innerHTML=m==='line'?lineChart(r):candleChart(r)};box.querySelector('.ctf').onchange=draw;box.querySelector('.cmode').onchange=draw})}
function renderCombined(){const q=$('cq').value.toUpperCase(),tr=$('ctr').value,tf=$('cstf').value,l=$('cslen').value,sc=$('cscond').value,ct=$('cctf').value,p=$('cpat').value,n=$('clevel').value,lc=$('clcond').value;const r=all.filter(x=>(!q||x.symbol.includes(q))&&(!tr||x.trend===tr)&&smaMatch(x,tf,l,sc)&&patMatch(x,ct,p)&&levMatch(x,n,lc));$('combinedGrid').innerHTML=r.length?r.map(x=>card(x)).join(''):'<div class="empty">No match</div>';wire($('combinedGrid'))}
function renderSma(){const q=$('sq').value.toUpperCase(),tf=$('stf').value,l=$('slen').value,c=$('scond').value,r=all.filter(x=>(!q||x.symbol.includes(q))&&smaMatch(x,tf,l,c));$('smaGrid').innerHTML=r.length?r.map(x=>{const i=sma(x,tf);return card(x,`<span class="tag near">${tf} SMA${l}: ₹${val(i[`sma${l}`])} · ${val(i[`distance${l}_pct`],'%')}</span>`)}).join(''):'<div class="empty">No match</div>';wire($('smaGrid'))}
function renderCandle(){const q=$('pq').value.toUpperCase(),tf=$('ptf').value,p=$('pname').value,r=all.filter(x=>(!q||x.symbol.includes(q))&&patMatch(x,tf,p)&&((tf||p)||Object.values(x.patterns||{}).some(v=>primary(v))));$('candleGrid').innerHTML=r.length?r.map(x=>card(x,Object.entries(x.patterns||{}).map(([t,v])=>primary(v)?`<span class="tag pattern">${t}: ${primary(v)}</span>`:'').join(''))).join(''):'<div class="empty">No pattern match</div>';wire($('candleGrid'))}
function renderLevels(){const q=$('lq').value.toUpperCase(),n=$('lname').value,c=$('lmode').value,t=+$('lpct').value,r=all.filter(x=>(!q||x.symbol.includes(q))&&levMatch(x,n,c,t));$('levelGrid').innerHTML=r.length?r.map(x=>card(x,Object.entries(x.levels||{}).filter(([k])=>!n||k===n).map(([k,v])=>`<span class="tag level">${k} ₹${val(v.value)} · ${val(v.distance_pct,'%')}</span>`).join(''))).join(''):'<div class="empty">No level match</div>';wire($('levelGrid'))}
function renderAll(){renderCombined();renderSma();renderCandle();renderLevels()}
async function load(){try{const [a,b]=await Promise.all([fetch('data/results.json?'+Date.now(),{cache:'no-store'}),fetch('data/extended.json?'+Date.now(),{cache:'no-store'})]);const d=await a.json();all=d.results||[];if(b.ok)ext=await b.json();const names=d.pattern_names||P,$opts=names.map(x=>`<option>${x}</option>`).join('');$('cpat').innerHTML='<option value="">Any pattern</option>'+$opts;$('pname').innerHTML='<option value="">All patterns</option>'+$opts;$('status').textContent=`NSE · ${all.length} stocks · ${new Date(d.updated_at).toLocaleString()}`;renderAll()}catch(e){$('status').textContent='Scanner data unavailable'}}
function atm(rows,u){let z=0,b=Infinity;rows.forEach((r,i)=>{const d=Math.abs(+r.strike-+u);if(d<b){b=d;z=i}});return z}function renderOC(){const s=$('ocs').value,e=$('oce').value,d=oc.data?.[s],ch=d?.chains?.[e];if(!ch){$('octable').innerHTML='<div class="empty">Option chain unavailable</div>';return}let rows=ch.rows||[],ai=atm(rows,d.underlying),as=rows[ai]?.strike,m=$('ocr').value;if(m!=='all'){const n=+m;rows=rows.slice(Math.max(0,ai-n),ai+n+1)}$('ocstats').innerHTML=`<div class="metric">Underlying<br><b>${val(d.underlying)}</b></div><div class="metric">PCR OI<br><b>${val(ch.pcr_oi)}</b></div><div class="metric">PCR Volume<br><b>${val(ch.pcr_volume)}</b></div>`;const H='<table class="octable"><tr><th>CE OI</th><th>CE ΔOI</th><th>CE Vol</th><th>CE IV</th><th>CE LTP</th><th class="strike">Strike</th><th>PE LTP</th><th>PE IV</th><th>PE Vol</th><th>PE ΔOI</th><th>PE OI</th></tr>',B=rows.map(r=>`<tr class="${+r.strike===+as?'atm':''}"><td>${val(r.ce?.oi)}</td><td>${val(r.ce?.oi_change)}</td><td>${val(r.ce?.volume)}</td><td>${val(r.ce?.iv)}</td><td>${val(r.ce?.ltp)}</td><td class="strike">${r.strike}</td><td>${val(r.pe?.ltp)}</td><td>${val(r.pe?.iv)}</td><td>${val(r.pe?.volume)}</td><td>${val(r.pe?.oi_change)}</td><td>${val(r.pe?.oi)}</td></tr>`).join('');$('octable').innerHTML=H+B+'</table>'}function expiries(){const d=oc.data?.[$('ocs').value],a=d?.expiries||Object.keys(d?.chains||{});$('oce').innerHTML=a.map(x=>`<option>${x}</option>`).join('');renderOC()}async function loadOC(){try{const r=await fetch('data/option_chain.json?'+Date.now(),{cache:'no-store'});oc=await r.json();const s=oc.symbols||[];$('ocs').innerHTML=s.map(x=>`<option>${x}</option>`).join('');$('ocstatus').textContent=oc.updated_at?`Updated ${new Date(oc.updated_at).toLocaleString()}`:'No option data';if(s.length)expiries()}catch(e){$('ocstatus').textContent='Option data unavailable'}}
document.querySelectorAll('button.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('button.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')});['cq','ctr','cstf','cslen','cscond','cctf','cpat','clevel','clcond'].forEach(i=>$(i).oninput=renderCombined);['sq','stf','slen','scond'].forEach(i=>$(i).oninput=renderSma);['pq','ptf','pname'].forEach(i=>$(i).oninput=renderCandle);['lq','lname','lmode','lpct'].forEach(i=>$(i).oninput=renderLevels);$('creset').onclick=()=>{['cq','ctr','cstf','cslen','cscond','cctf','cpat','clevel','clcond'].forEach(i=>$(i).value='');renderCombined()};$('ocs').onchange=expiries;$('oce').onchange=renderOC;$('ocr').onchange=renderOC;$('ocrf').onclick=loadOC;function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'});$('date').textContent=d.toLocaleDateString('en-IN',{timeZone:'Asia/Kolkata'})}tick();setInterval(tick,1000);load();loadOC();
</script></body></html>
